<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 ④ 안내 문구 관리</title>
<link rel="stylesheet" href="mock.css">
<style>
  .head{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:12px}
  .head h1{font-size:18px;margin:0}
  .head .sp{flex:1}
  .crumb{color:var(--sub);font-size:13px}
  .crumb a{color:var(--sub)}
  .main{max-width:980px;margin:0 auto;padding:18px 20px 120px}
  .tools{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:30px;z-index:20;box-shadow:var(--sh-1)}
  .sbox{position:relative}
  .sbox input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px 0 40px;font-size:15px;background:var(--sunk)}
  .sbox input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:var(--focus)}
  .sbox::before{content:"🔎";position:absolute;left:14px;top:13px}
  .frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .frow .lb{font-size:12px;font-weight:800;color:var(--sub);width:34px}
  .res{display:flex;align-items:center;gap:10px;margin:14px 2px 8px;color:var(--sub);font-weight:700}
  .res .sp{flex:1}
  .nc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:border-color .15s}
  .nc.changed{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
  .nc .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .nc .t b{font-size:15px}
  .nc .k{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--sub);background:var(--sunk2);padding:1px 6px;border-radius:5px}
  .where{display:flex;gap:8px;margin:8px 0;font-size:13px;align-items:flex-start}
  .where span:first-child{flex:0 0 64px;color:var(--sub);font-weight:700}
  .cur{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6;border:1px solid var(--line)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
  .acts{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .acts .sp{flex:1}
  .kk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);font-weight:700}
  .sw{width:38px;height:22px;border-radius:999px;background:#d6cfc8;position:relative;cursor:pointer;border:0}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
  .sw.on{background:var(--ok)} .sw.on::after{left:19px}
  .edit{margin-top:10px;display:none}
  .nc.editing .edit{display:block}
  .nc.editing .cur{display:none}
  .tip{font-size:12px;color:var(--sub);margin-top:6px}
  .tip code{background:var(--sunk2);padding:0 4px;border-radius:4px}
  .warn{color:var(--bad);font-size:12.5px;font-weight:700;margin-top:6px;display:none}
  .warn.on{display:block}
  .dflt{display:none;margin-top:10px;background:var(--bluebg);border-radius:12px;padding:10px 12px}
  .nc.showdef .dflt{display:block}
  .dflt .h{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:4px;display:flex;align-items:center}
  .dflt .h .sp{flex:1}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06);z-index:40}
  .savebar .in{max-width:980px;margin:0 auto;padding:12px 20px;display:flex;gap:8px;align-items:center}
  .savebar .sp{flex:1}
  .savebar .cnt{font-weight:800}
  .diff{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .diff .h{background:var(--sunk);padding:8px 12px;font-weight:800;font-size:13px}
  .diff .m{padding:8px 12px;background:#fdf1f1;color:#a33;font-size:13px;white-space:pre-wrap}
  .diff .p{padding:8px 12px;background:#eef8f1;color:#17663a;font-size:13px;white-space:pre-wrap}
  /* 미리보기 폰 */
  .pv{width:340px;height:620px;margin:0 auto;border-radius:28px;background:var(--bg);box-shadow:0 0 0 8px #1f1b1a;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .pv .tp{background:#fff;padding:10px 14px;border-bottom:1px solid var(--line)}
  .pv .bd{flex:1;padding:14px;overflow:auto;position:relative}
  .pv .fld{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .pv .fi{height:40px;border:1.5px solid var(--bad);border-radius:10px;background:#fff}
  .pv .er{color:var(--bad);font-size:12.5px;margin-top:6px;outline:2px dashed var(--accent);outline-offset:3px;border-radius:4px}
  .pv .ghost{height:12px;border-radius:6px;background:#e3ddd6;margin-bottom:8px}
  .pv .pop{position:absolute;inset:0;background:rgba(30,26,24,.5);display:flex;align-items:center;justify-content:center;padding:18px}
  .pv .pop .b{background:#fff;border-radius:16px;padding:18px;text-align:center;width:100%}
  .pv .pop .m{text-align:left;font-size:13px;margin:8px 0 12px;outline:2px dashed var(--accent);outline-offset:3px;border-radius:4px}
  .pv .kb{display:inline-block;background:#FEE500;color:#191600;font-weight:800;padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:10px}
  .pv .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:18px;text-align:center}
  .pv .box{background:#fff4f4;border:1px solid #f3cccc;border-radius:12px;padding:12px;font-size:13px;outline:2px dashed var(--accent);outline-offset:3px}
  .pvnote{text-align:center;font-size:12px;color:var(--sub);margin-top:10px}
</style></head><body>
<div class="head"><span class="logochip"><img class="logo" src="logo.png" alt="아이닉"></span>
  <div><div class="crumb"><a href="settings.html">이벤트/접수폼 관리</a> › 안내 문구</div><h1>안내 문구 관리</h1></div><span class="sp"></span>
  <button class="btn sm" onclick="toast('시안: 기존 CSV 내보내기 그대로')">CSV 내보내기</button><button class="btn sm" onclick="toast('시안: 기존 CSV 가져오기(변경 확인 후 적용) 그대로')">CSV 가져오기</button>
</div>
<div class="main">
  <div class="tools">
    <div class="sbox"><input id="q" placeholder="찾을 문구나 화면을 입력하세요  예) S/N, 이메일, 완료, 만료" autofocus></div>
    <div class="frow"><span class="lb">화면</span><div id="fsc" style="display:contents"></div></div>
    <div class="frow"><span class="lb">상황</span><div id="fsi" style="display:contents"></div><span style="flex:1"></span>
      <label style="display:flex;gap:6px;align-items:center;font-weight:700;font-size:12.5px;color:var(--sub);cursor:pointer"><input type="checkbox" id="onlyChg"> 변경한 것만</label></div>
  </div>
  <div class="res"><span id="rc"></span><span class="sp"></span><span class="hint">카드의 「수정」을 누르면 바로 고칠 수 있어요. 저장 전까지는 고객 화면이 바뀌지 않습니다.</span></div>
  <div id="cards"></div>
</div>
<div class="savebar"><div class="in"><span class="dot" id="sdot" style="display:none"></span><span class="cnt" id="scnt">변경 없음</span>
  <button class="btn sm" id="viewChg" disabled>변경 내용 보기</button><button class="btn sm ghost" id="undoAll" disabled>모두 되돌리기</button>
  <span class="sp"></span><span class="hint">저장하면 약 1분 뒤 고객 화면에 반영됩니다</span><button class="btn primary" id="save" disabled>저장</button></div></div>

<div class="modal" id="mChg"><div class="box"><div class="hd">저장 전 확인 <span class="chip accent nodot" id="mcnt"></span><span style="flex:1"></span><button class="btn sm ghost" onclick="closeM('mChg')">✕</button></div>
  <div class="bd" id="mChgBody"></div><div class="ft"><button class="btn" onclick="closeM('mChg')">계속 수정</button><button class="btn primary" onclick="closeM('mChg');NOSAVE()">이대로 저장</button></div></div></div>
<div class="modal" id="mPv"><div class="box" style="width:420px"><div class="hd" id="pvTitle">미리보기</div><div class="bd" id="pvBody"></div>
  <div class="ft"><span class="hint" style="margin-right:auto">점선 = 이 문구가 나오는 자리</span><button class="btn primary" onclick="closeM('mPv')">닫기</button></div></div></div>

<script src="mock.js"></script>
<script>
mockbar("notices.html");
const SAVED = JSON.parse(JSON.stringify(NOTICES));
const N = JSON.parse(JSON.stringify(NOTICES));
const F = { q:"", sc:new URLSearchParams(location.search).get("screen")||"", si:"", only:false };
const ui = {};   // 카드별 펼침 상태
const changed = n => { const s=SAVED.find(x=>x.k===n.k); return s.t!==n.t || s.kakao!==n.kakao; };
const phCount = t => (String(t).match(/○+/g)||[]).length;
function chips(){
  $("#fsc").innerHTML = `<button class="fchip ${!F.sc?"on":""}" data-sc="">전체</button>` + Object.entries(SCREENS).map(([k,v])=>`<button class="fchip ${F.sc===k?"on":""}" data-sc="${k}">${v}</button>`).join("");
  $("#fsi").innerHTML = `<button class="fchip ${!F.si?"on":""}" data-si="">전체</button>` + Object.entries(SITS).map(([k,v])=>`<button class="fchip ${F.si===k?"on":""}" data-si="${k}">${v}</button>`).join("");
}
function list(){
  const q=F.q.trim().toLowerCase();
  return N.filter(n=>(!F.sc||n.sc===F.sc)&&(!F.si||n.si===F.si)&&(!F.only||changed(n))
    &&(!q||[n.n,n.where,n.t,n.k,SCREENS[n.sc],SITS[n.si]].join(" ").toLowerCase().includes(q)));
}
function hl(s){ const q=F.q.trim(); if(!q) return s; return s.split(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig")).map((p,i)=>i%2?`<mark>${p}</mark>`:p).join(""); }
function card(n){
  const c=changed(n), st=ui[n.k]||{}, bad=phCount(n.t)!==n.ph;
  return `<div class="nc ${c?"changed":""} ${st.edit?"editing":""} ${st.def?"showdef":""}" data-k="${n.k}">
    <div class="t">${c?'<span class="dot" title="변경됨"></span>':""}<b>${hl(esc(n.n))}</b><span class="chip ${n.si==="err"?"bad":n.si==="reject"?"warn":n.si==="dup"?"warn":n.si==="done"?"ok":"blue"} nodot">${SITS[n.si]}</span>
      ${n.isNew?'<span class="chip accent nodot">새로 관리 가능</span>':""}<span style="flex:1"></span><span class="k">${n.k}</span></div>
    <div class="where"><span>표시 위치</span><span>${hl(esc(n.where))}</span></div>
    <div class="where"><span>현재 문구</span><span style="flex:1"><div class="cur">${rich(n.t)}</div>
      <div class="edit"><textarea class="inp" data-ta="${n.k}" rows="3">${esc(n.t)}</textarea>
        <div class="tip">${n.ph?`<b>○○</b> 자리 ${n.ph}개가 실제 값(${n.si==="done"?"사은품 이름":n.k==="consentDeny"?"항목 이름":n.k==="checkNone"?"고객 성함":"입고 시점"})으로 바뀝니다. · `:""}<code>[[빨간 굵게]]</code> <code>{{굵게}}</code> · 줄바꿈 그대로 표시</div>
        <div class="warn ${bad?"on":""}" data-w="${n.k}">⚠ ○○ 자리가 ${n.ph}개여야 합니다 (지금 ${phCount(n.t)}개). 값이 엉뚱한 자리에 들어갈 수 있어요.</div></div></span></div>
    <div class="dflt"><div class="h">기본 문구<span class="sp"></span><button class="btn sm" data-act="restore">이 문구로 되돌리기</button></div>${rich(n.d)}</div>
    <div class="acts">
      <button class="btn sm ${st.edit?"primary":""}" data-act="edit">${st.edit?"수정 완료":"✎ 수정"}</button>
      <button class="btn sm" data-act="def">${st.def?"기본값 닫기":"기본값 보기"}</button>
      <button class="btn sm" data-act="pv">👁 미리보기</button>
      ${c?`<button class="btn sm ghost" data-act="undo">↺ 변경 취소</button>`:""}
      <span class="sp"></span>
      ${n.kakao===null?`<span class="kk">💬 이 문구는 상담 버튼을 지원하지 않습니다</span>`
        :`<span class="kk">💬 카카오 상담 버튼 <button class="sw ${n.kakao?"on":""}" data-act="kakao" aria-label="상담 버튼"></button></span>`}
    </div></div>`;
}
function render(){
  chips(); const L=list();
  $("#rc").textContent = `${L.length}개 문구` + (F.q?` · 「${F.q}」 검색 결과`:"");
  $("#cards").innerHTML = L.length ? L.map(card).join("") : `<div class="card" style="padding:40px;text-align:center;color:var(--sub)">찾는 문구가 없습니다. 다른 단어로 검색해 보세요.</div>`;
  const cnt=N.filter(changed).length;
  $("#scnt").textContent = cnt?`변경 ${cnt}건 · 아직 저장 안 됨`:"변경 없음"; $("#sdot").style.display=cnt?"":"none";
  ["viewChg","undoAll","save"].forEach(id=>$("#"+id).disabled=!cnt);
}
function closeM(id){ $("#"+id).classList.remove("on"); }
function preview(n){
  $("#pvTitle").textContent = "미리보기 · "+n.where;
  const top = `<div class="tp"><img src="logo.png" style="height:20px"></div>`;
  const kb = n.kakao ? `<div class="kb">💬 아이닉 카카오톡 채널로 문의하기</div>` : "";
  const fill = t => { const v=n.si==="done"?["디바이더 7L"]:n.k==="consentDeny"?["개인정보 수집 및 이용 동의"]:n.k==="checkNone"?["홍길동"]:["10월 중순"]; let i=0; return t.replace(/○+/g,()=>v[i++]||"○○"); };
  let body;
  if(n.si==="err") body = `<div class="ghost" style="width:60%"></div><div class="fld"><div class="ghost" style="width:40%"></div><div class="fi"></div><div class="er">${rich(fill(n.t))}</div></div><div class="fld"><div class="ghost" style="width:50%"></div><div class="ghost"></div></div>`;
  else if(n.si==="reject"||n.si==="dup") body = `<div class="fld"><div class="ghost"></div><div class="ghost" style="width:70%"></div></div><div class="pop"><div class="b"><div style="font-size:26px">⚠️</div><b>접수하지 못했습니다</b><div class="m">${rich(fill(n.t))}</div>${kb}<div class="btn primary" style="width:100%">확인</div></div></div>`;
  else if(n.si==="done") body = `<div class="fld"><div class="ghost"></div></div><div class="sheet"><div style="font-size:30px;color:var(--ok)">✓</div><b>접수가 완료되었습니다</b><div class="m" style="text-align:left;font-size:13px;margin:10px 0;outline:2px dashed var(--accent);outline-offset:3px;border-radius:4px">${rich(fill(n.t))}</div><div class="btn primary" style="width:100%">처음으로</div></div>`;
  else body = `<div class="ghost" style="width:60%"></div><div class="fld"><div class="ghost"></div><div class="ghost" style="width:80%"></div></div><div class="box">${rich(fill(n.t))}</div>${kb?'<div style="margin-top:10px">'+kb+'</div>':""}`;
  $("#pvBody").innerHTML = `<div class="pv">${top}<div class="bd">${body}</div></div><div class="pvnote">실제 화면은 기존 「실제 화면 미리보기」 기능으로 그려집니다 (시안은 모양만 표시)</div>`;
  $("#mPv").classList.add("on");
}
document.addEventListener("click",ev=>{
  const f=ev.target.closest("[data-sc],[data-si]"); if(f){ if(f.dataset.sc!=null) F.sc=f.dataset.sc; if(f.dataset.si!=null) F.si=f.dataset.si; render(); return; }
  const b=ev.target.closest("[data-act]"); if(!b) return; const k=b.closest(".nc")&&b.closest(".nc").dataset.k; const n=N.find(x=>x.k===k); const st=ui[k]=ui[k]||{};
  const a=b.dataset.act;
  if(a==="edit"){ st.edit=!st.edit; render(); if(st.edit){ const ta=$(`[data-ta="${k}"]`); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); } }
  if(a==="def"){ st.def=!st.def; render(); }
  if(a==="restore"){ n.t=n.d; st.def=false; render(); toast("기본 문구로 되돌렸습니다 (저장 전)"); }
  if(a==="undo"){ const s=SAVED.find(x=>x.k===k); n.t=s.t; n.kakao=s.kakao; st.edit=false; render(); }
  if(a==="pv") preview(n);
  if(a==="kakao"){ n.kakao=!n.kakao; render(); }
});
document.addEventListener("input",ev=>{
  const k=ev.target.dataset&&ev.target.dataset.ta; if(!k) return; const n=N.find(x=>x.k===k); n.t=ev.target.value;
  const w=$(`[data-w="${k}"]`); const c=phCount(n.t); w.classList.toggle("on",c!==n.ph); w.textContent=`⚠ ○○ 자리가 ${n.ph}개여야 합니다 (지금 ${c}개). 값이 엉뚱한 자리에 들어갈 수 있어요.`;
  const card=ev.target.closest(".nc"); card.classList.toggle("changed",changed(n)); card.querySelector(".cur").innerHTML=rich(n.t);
  const cnt=N.filter(changed).length; $("#scnt").textContent=cnt?`변경 ${cnt}건 · 아직 저장 안 됨`:"변경 없음"; $("#sdot").style.display=cnt?"":"none"; ["viewChg","undoAll","save"].forEach(id=>$("#"+id).disabled=!cnt);
});
$("#q").oninput=e=>{ F.q=e.target.value; render(); };
$("#onlyChg").onchange=e=>{ F.only=e.target.checked; render(); };
$("#undoAll").onclick=()=>{ N.forEach(n=>{ const s=SAVED.find(x=>x.k===n.k); n.t=s.t; n.kakao=s.kakao; }); Object.keys(ui).forEach(k=>ui[k].edit=false); render(); };
const showChanges=()=>{ const c=N.filter(changed); $("#mcnt").textContent=c.length+"건";
  $("#mChgBody").innerHTML=c.map(n=>{ const s=SAVED.find(x=>x.k===n.k); return `<div class="diff"><div class="h">${esc(n.n)} · <span class="hint">${esc(n.where)}</span></div>
    ${s.t!==n.t?`<div class="m">− ${esc(s.t)}</div><div class="p">+ ${esc(n.t)}</div>`:""}${s.kakao!==n.kakao?`<div class="p">상담 버튼: ${s.kakao?"켬":"끔"} → ${n.kakao?"켬":"끔"}</div>`:""}</div>`; }).join("")
    + (c.some(n=>phCount(n.t)!==n.ph)?`<div class="warn on">⚠ ○○ 자리 수가 맞지 않는 문구가 있습니다. 그래도 저장할 수는 있습니다.</div>`:"");
  $("#mChg").classList.add("on"); };
$("#viewChg").onclick=showChanges; $("#save").onclick=showChanges;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $$(".modal.on").forEach(m=>m.classList.remove("on")); });
if(F.sc) $("#q").removeAttribute("autofocus");
render();
</script></body></html>
